<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#10B981" />
        <title>غير متصل — أوان</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                font-family: system-ui, sans-serif;
                background: #f3f5f9;
                color: #18181b;
                padding: 1.5rem;
                text-align: center;
            }

            main {
                max-width: 22rem;
            }

            h1 {
                font-size: 1.25rem;
                margin: 0 0 0.75rem;
            }

            p {
                margin: 0;
                color: #52525b;
                line-height: 1.6;
            }

            .links {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.75rem;
                margin-top: 1.25rem;
            }

            a {
                display: inline-block;
                padding: 0.5rem 1rem;
                border-radius: 9999px;
                background: #10b981;
                color: #fff;
                font-weight: 600;
                text-decoration: none;
                font-size: 0.875rem;
            }

            a.secondary {
                background: #fff;
                color: #047857;
                border: 1px solid #d4d4d8;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>أنت غير متصل</h1>
            <p>تحقق من اتصال الإنترنت ثم أعد فتح أوان.</p>
            <p lang="en" dir="ltr" style="margin-top: 0.75rem; font-size: 0.875rem;">You are offline. Check your connection and try again.</p>
            <div class="links">
                <a href="/patient">المريض</a>
                <a href="/doctor" class="secondary">الطبيب</a>
            </div>
        </main>
    </body>
</html>
